[package]
name = "mockups"
version = "0.1.0"
edition = "2021"

[lib]
name = "mockups_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
portable-pty = "0.9"
tauri-plugin-clipboard-manager = "2"
png = "0.18"
